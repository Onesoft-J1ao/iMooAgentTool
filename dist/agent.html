<!doctype html>
<html>
<head><meta charset="UTF-8"><title>AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#1e293b;color:#e2e8f0;overflow:hidden;user-select:none}
.ap{display:flex;flex-direction:column;height:100vh}
.ah{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #334155;background:linear-gradient(135deg,#1e293b,#0f172a);-webkit-app-region:drag}
.aht{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ahb{display:flex;gap:4px;-webkit-app-region:no-drag}
.ahc{background:none;border:none;color:#64748b;cursor:pointer;padding:2px 8px;border-radius:4px;font-size:14px}
.ahc:hover{color:#f1f5f9;background:rgba(255,255,255,.1)}
.at{display:flex;border-bottom:1px solid #334155;padding:4px 12px;gap:4px}
.atb{flex:1;padding:6px 0;text-align:center;font-size:11px;color:#64748b;cursor:pointer;border-radius:6px;border:none;background:transparent}
.atb.act{color:#60a5fa;background:rgba(59,130,246,.15);font-weight:600}
.am{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
.ams{display:flex;margin-bottom:8px;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ams.u{justify-content:flex-end}
.ams.a{justify-content:flex-start}
.ab{max-width:85%;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;word-break:break-word}
.ams.u .ab{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.15);color:#f1f5f9}
.ams.a .ab{background:rgba(51,65,85,.5);border:1px solid rgba(71,85,105,.25);color:#e2e8f0}
.ai_{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #334155;background:#0f172a}
.ai_i{flex:1;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:7px 10px;color:#f1f5f9;font-size:12px;outline:none}
.ai_i:focus{border-color:#3b82f6}.ai_i::placeholder{color:#475569}
.ai_s{background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:12px}
.ai_s:disabled{opacity:.4}.em{text-align:center;padding:30px;color:#64748b;font-size:12px}
.fc{margin-top:6px;padding:6px 8px;background:rgba(30,41,59,.8);border-radius:6px;border:1px solid rgba(71,85,105,.3)}
.fch{display:flex;justify-content:space-between}
.fcn{font-size:12px;font-weight:500;color:#93c5fd}
.fcg{font-size:11px;color:#60a5fa;cursor:pointer}
.fcd{font-size:10px;color:#94a3b8;margin-top:2px}
.fcb{margin-top:4px;height:3px;background:#334155;border-radius:2px;overflow:hidden}
.fcbf{height:100%}.fcl{font-size:9px;color:#64748b;text-align:right}
</style>
</head>
<body>
<div class="ap">
  <div class="ah">
    <div class="aht"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 3.5 2 6.5 5 7.8V22l4-4h3a8 8 0 0 0 0-16h-4z"/></svg>AI 助手</div>
    <div class="ahb"><button class="ahc" id="minBtn" title="最小化">─</button><button class="ahc" id="cfgBtn" title="配置">⚙</button><button class="ahc" id="closeBtn" title="关闭">✕</button></div>
  </div>
  <div class="at"><button class="atb act" id="searchTab">🔍 搜索</button><button class="atb" id="chatTab">💬 对话</button></div>
  <div class="am" id="msgArea"><div class="em" id="empty">🤖<br><br>输入关键词搜索功能</div></div>
  <div class="ai_"><input class="ai_i" id="input" placeholder="搜索功能..."><button class="ai_s" id="sendBtn">发送</button></div>
</div>
<script>
var H=[],mode='s',loading=false,configLoaded=false;
var $=function(id){return document.getElementById(id)};
var api=window.agentApi||{};
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
  var msgs=H.filter(function(m){return m.role!=='l'});
  var a=$('msgArea'),e=$('empty');
  if(msgs.length===0){e.style.display='';a.querySelectorAll('.ams').forEach(function(el){el.remove()});return}
  e.style.display='none';a.querySelectorAll('.ams').forEach(function(el){el.remove()});
  msgs.forEach(function(m){
    var d=document.createElement('div');d.className='ams '+(m.role==='user'?'u':'a');
    var h='<div class="ab">';
    if(m.role==='a')h+='<div style="text-align:right;margin-bottom:4px"><button class="copy-btn" data-t="'+es(m.text)+'" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:10px;padding:1px 4px;border-radius:3px">📋 复制</button></div>';
    h+='<div>'+es(m.text)+'</div>';
    if(m.features&&m.features.length>0)m.features.forEach(function(f){h+='<div class="fc"><div class="fch"><span class="fcn">'+es(f.name)+'</span></div><div class="fcd">'+es(f.explanation||'')+'</div><div class="fcb"><div class="fcbf" style="width:'+f.confidence+'%;background:'+(f.confidence>=70?'#22c55e':f.confidence>=40?'#eab308':'#64748b')+'"></div></div><div class="fcl">'+f.confidence+'%</div></div>'});
    h+='</div>';d.innerHTML=h;a.appendChild(d);
  });
  a.scrollTop=a.scrollHeight;
  a.querySelectorAll('.copy-btn').forEach(function(btn){
    btn.onclick=function(){var t=btn.dataset.t;if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){btn.textContent='✓ 已复制';setTimeout(function(){btn.textContent='📋 复制'},1500)}).catch(function(){})}};
  });
}
function send(){
  var inp=$('input'),snd=$('sendBtn');
  var t=inp.value.trim();if(!t||loading)return;
  inp.value='';snd.disabled=true;loading=true;
  H.push({id:'m'+Date.now(),role:'user',text:t});render();
  var lid='l'+Date.now();H.push({id:lid,role:'l'});render();
  if(mode==='s'){
    (api.search?api.search(t):Promise.resolve({matches:[]})).then(function(r){
      loading=false;snd.disabled=false;
      H=H.filter(function(m){return m.id!==lid});
      if(r.matches&&r.matches.length>0)H.push({id:'m'+Date.now(),role:'a',text:'找到 '+r.matches.length+' 个功能：',features:r.matches.map(function(f){return{name:f.name,explanation:f.explanation,confidence:f.confidence,path:f.path}}),ai:r.aiPowered});
      else H.push({id:'m'+Date.now(),role:'a',text:'未找到相关功能'});
      render();
    }).catch(function(){loading=false;snd.disabled=false;H=H.filter(function(m){return m.id!==lid});H.push({id:'m'+Date.now(),role:'a',text:'查询失败'});render()});
  }else{
    var ms=H.filter(function(m){return m.role!=='l'}).map(function(m){return{role:m.role==='user'?'user':'assistant',content:m.text}});
    ms.push({role:'user',content:t});
    (api.chat?api.chat(ms):Promise.resolve({reply:'AI未配置'})).then(function(r){
      loading=false;snd.disabled=false;H=H.filter(function(m){return m.id!==lid});H.push({id:'m'+Date.now(),role:'a',text:r.reply||''});render();
    }).catch(function(){loading=false;snd.disabled=false;H=H.filter(function(m){return m.id!==lid});H.push({id:'m'+Date.now(),role:'a',text:'对话失败'});render()});
  }
}
$('sendBtn').onclick=send;$('input').onkeydown=function(e){if(e.key==='Enter')send()};$('input').oninput=function(){$('sendBtn').disabled=!$('input').value.trim()||loading};
$('searchTab').onclick=function(){$('searchTab').classList.add('act');$('chatTab').classList.remove('act');mode='s';$('input').placeholder='搜索功能...'};
$('chatTab').onclick=function(){$('chatTab').classList.add('act');$('searchTab').classList.remove('act');mode='c';$('input').placeholder='输入消息...'};
$('closeBtn').onclick=function(){window.close()};
$('minBtn').onclick=function(){if(window.api&&window.api.minimize)window.api.minimize();else if(window.agentApi&&window.agentApi.minimize)window.agentApi.minimize()};
$('cfgBtn').onclick=function(){
  api.getConfig().then(function(cfg){
    var bg=document.createElement('div');bg.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:999;display:flex;align-items:center;justify-content:center';
    var d=document.createElement('div');d.style.cssText='background:#1e293b;border:1px solid #334155;border-radius:10px;padding:20px;width:300px;color:#f1f5f9;font-size:12px';
    d.innerHTML='<h3 style="margin:0 0 12px;font-size:14px">配置</h3>'+
      '<label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px"><input type="checkbox" id="aen"'+(cfg.enabled?' checked':'')+'>启用</label>'+
      '<div style="margin-bottom:8px"><input id="aurl" value="'+es(cfg.apiUrl||'')+'" placeholder="API URL" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 8px;color:#f1f5f9;font-size:12px;outline:none;box-sizing:border-box"></div>'+
      '<div style="margin-bottom:8px"><input id="akey" type="password" value="'+es(cfg.apiKey||'')+'" placeholder="API Key" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 8px;color:#f1f5f9;font-size:12px;outline:none;box-sizing:border-box"></div>'+
      '<div style="margin-bottom:12px"><input id="amdl" value="'+es(cfg.model||'gpt-4o-mini')+'" placeholder="model" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 8px;color:#f1f5f9;font-size:12px;outline:none;box-sizing:border-box"></div>'+
      '<div style="display:flex;gap:6px">'+
      '<button id="atest" style="flex:1;background:transparent;color:#94a3b8;border:1px solid #475569;border-radius:6px;padding:6px;cursor:pointer;font-size:11px">测试</button>'+
      '<button id="asave" style="flex:1;background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:6px;cursor:pointer;font-size:11px">保存</button>'+
      '<button id="aclose" style="background:#334155;color:#f1f5f9;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:11px">取消</button></div>'+
      '<div id="astatus" style="margin-top:8px;font-size:11px;color:#94a3b8;text-align:center"></div>';
    bg.appendChild(d);document.body.appendChild(bg);
    $('aclose').onclick=function(){bg.remove()};
    $('asave').onclick=function(){
      api.setConfig({enabled:$('aen').checked,apiUrl:$('aurl').value,apiKey:$('akey').value,model:$('amdl').value||'gpt-4o-mini'});
      $('astatus').textContent='✓ 已保存';$('astatus').style.color='#22c55e';
      setTimeout(function(){bg.remove()},800);
    };
    $('atest').onclick=function(){
      $('astatus').textContent='测试中...';$('astatus').style.color='#94a3b8';
      api.testConnection($('aurl').value,$('akey').value,$('amdl').value||'gpt-4o-mini').then(function(r){
        $('astatus').textContent=r.success?'✓ '+r.message:'✗ '+r.message;$('astatus').style.color=r.success?'#22c55e':'#ef4444';
      }).catch(function(e){$('astatus').textContent='✗ '+e.message;$('astatus').style.color='#ef4444'});
    };
  }).catch(function(){alert('Config error')});
};
render();
</script>
</body>
</html>
